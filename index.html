<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>asking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow glow-1" aria-hidden="true"></div>
  <div class="bg-glow glow-2" aria-hidden="true"></div>

  <div id="floatingHearts" class="floating-hearts" aria-hidden="true"></div>

  <main class="app">
    <section id="mainScreen" class="screen screen-active">
      <article class="love-card" aria-live="polite">
        <div id="character" class="character" aria-hidden="true">
          <div class="heart-shape">
            <span class="face eye eye-left"></span>
            <span class="face eye eye-right"></span>
            <span class="face mouth"></span>
            <span class="blush blush-left"></span>
            <span class="blush blush-right"></span>
          </div>
          <span class="sparkle sparkle-1">✨</span>
          <span class="sparkle sparkle-2">💗</span>
        </div>

       
        <p class="question">الجمر لسة زعلان؟ 🥺</p>

        <p id="yesMessage" class="yes-message"></p>

        <div id="actions" class="actions">
          <button id="yesBtn" class="btn btn-yes" type="button">Yes 🥺</button>
          <button id="noBtn" class="btn btn-no" type="button">No 💗</button>
        </div>
      </article>
    </section>

    <section id="celebrationScreen" class="screen celebration-screen" aria-live="polite">
      <div class="celebration-card">
        <h2>اخييييييرا 😍💗</h2>
      
      </div>
      <div id="burstLayer" class="burst-layer" aria-hidden="true"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
